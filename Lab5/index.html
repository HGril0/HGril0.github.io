<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercícios JavaScript</title>
    <style>
      body {
        background-color: lavender;
        font-size: 20px;
        padding: 20px;
      }
      p {
        margin: 60px 0;
      }
    </style>
  </head>
  <body>
    <p id="ex1">1. Passa por aqui!</p>

    <p id="ex2">
      2. <span id="texto">Pinta-me!</span>
      <button onclick="pintar('red')">Red</button>
      <button onclick="pintar('green')">Green</button>
      <button onclick="pintar('blue')">Blue</button>
    </p>

    <p>3. Experimenta escrever... <input id="escrever" type="text" /></p>

    <p>
      4. Escolha uma cor em inglês:
      <input id="cor" type="text" />
      <button id="submeter">submeter</button>
    </p>

    <p>5. <button id="conta">Conta!</button> <span id="contador">0</span></p>

    <script>
      const ex1 = document.getElementById("ex1");
      ex1.addEventListener("mouseover", () => {
        ex1.textContent = "1. Obrigado por passares!";
      });
      ex1.addEventListener("mouseout", () => {
        ex1.textContent = "1. Passa por aqui!";
      });

      function pintar(cor) {
        document.getElementById("texto").style.color = cor;
      }

      const cores = ["lightblue", "khaki", "salmon", "gray"];
      const escrever = document.getElementById("escrever");
      escrever.addEventListener("input", () => {
        const n = escrever.value.length;
        if (n > 0) {
          escrever.style.backgroundColor = cores[(n - 1) % cores.length];
        }
      });

      document.getElementById("submeter").addEventListener("click", () => {
        document.body.style.backgroundColor =
          document.getElementById("cor").value;
      });

      let total = 0;
      document.getElementById("conta").addEventListener("click", () => {
        total++;
        document.getElementById("contador").textContent = total;
      });
    </script>
  </body>
</html>
