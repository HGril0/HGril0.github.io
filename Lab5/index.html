<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercícios JavaScript</title>
    <style>
      body {
        background-color: lavender;
        font-size: 20px;
        padding: 20px;
      }
      li {
        margin: 30px 0;
      }
      li div {
        margin-top: 10px;
      }
      #caixa {
        display: flex;
        gap: 10px;
        height: 200px;
        margin-top: 10px;
        padding: 10px;
        background-color: gray;
      }
      .bola {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <ol>
      <li id="passa">Passa por aqui!</li>

      <li>
        <span id="frase">Dá-me cor!</span>
        <div>
          <button class="color" data-color="orange">Laranja</button>
          <button class="color" data-color="teal">Turquesa</button>
          <button class="color" data-color="purple">Roxo</button>
        </div>
      </li>

      <li>
        Experimenta escrever...
        <div><input id="escrever" type="text" /></div>
      </li>

      <li>
        Escolha uma cor:
        <select id="corPagina">
          <option value="lavender">Lavanda</option>
          <option value="peachpuff">Pêssego</option>
          <option value="lightcyan">Gelo</option>
        </select>
      </li>

      <li><button id="conta">Conta!</button> <span id="contador">0</span></li>

      <li>
        <form id="formulario">
          <input
            id="nome"
            type="text"
            placeholder="Insira o seu nome"
            required
          />
          <input
            id="idade"
            type="number"
            placeholder="Insira a sua idade"
            required
          />
          <input type="submit" value="Submit" />
        </form>
        <p id="mensagem"></p>
      </li>

      <li>Automatic Counter: <span id="automatico">0</span></li>

      <li>
        Contador guardado: <span id="guardado">0</span>
        <div>
          <button id="incrementar">+1</button>
          <button id="decrementar">-1</button>
          <button id="reset">Reset</button>
        </div>
      </li>
    </ol>

    <section>
      <h2>Select flex</h2>
      <select id="direcao">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
        <option value="column-reverse">column-reverse</option>
      </select>
      <div id="caixa">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
      </div>
    </section>

    <script>
      const passa = document.querySelector("#passa");
      passa.addEventListener("mouseover", () => {
        passa.textContent = "Obrigado por passares!";
      });
      passa.addEventListener("mouseout", () => {
        passa.textContent = "Passa por aqui!";
      });

      const pintar = (cor) => {
        document.querySelector("#frase").style.color = cor;
      };

      document.querySelectorAll("button.color").forEach((botao) => {
        botao.addEventListener("click", () => pintar(botao.dataset.color));
      });

      const cores = ["lightblue", "khaki", "salmon", "gray"];
      const escrever = document.querySelector("#escrever");
      escrever.addEventListener("input", () => {
        const n = escrever.value.length;
        if (n > 0) {
          escrever.style.backgroundColor = cores[(n - 1) % cores.length];
        }
      });

      document
        .querySelector("#corPagina")
        .addEventListener("change", function () {
          document.body.style.backgroundColor = this.value;
        });

      let total = 0;
      document.querySelector("#conta").addEventListener("click", () => {
        total++;
        document.querySelector("#contador").textContent = total;
      });

      document.querySelector("#formulario").onsubmit = (e) => {
        e.preventDefault();
        const nome = document.querySelector("#nome").value;
        const idade = document.querySelector("#idade").value;
        document.querySelector("#mensagem").textContent =
          `Olá, o ${nome} tem ${idade}!`;
      };

      let segundos = 0;
      function count() {
        segundos++;
        document.querySelector("#automatico").textContent = segundos;
      }
      setInterval(count, 1000);

      const guardado = document.querySelector("#guardado");
      let valor = Number(localStorage.getItem("counter")) || 0;
      guardado.textContent = valor;

      const atualizar = (novoValor) => {
        valor = novoValor;
        guardado.textContent = valor;
        localStorage.setItem("counter", valor);
      };
      const incrementar = () => atualizar(valor + 1);
      const decrementar = () => atualizar(valor - 1);
      const reset = () => atualizar(0);

      document
        .querySelector("#incrementar")
        .addEventListener("click", incrementar);
      document
        .querySelector("#decrementar")
        .addEventListener("click", decrementar);
      document.querySelector("#reset").addEventListener("click", reset);

      document
        .querySelector("#direcao")
        .addEventListener("change", function () {
          document.querySelector("#caixa").style.flexDirection = this.value;
        });
    </script>
  </body>
</html>
