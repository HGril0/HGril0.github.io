<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercícios JavaScript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav><a href="../index.html">&larr; Voltar aos labs</a></nav>
    <ol>
      <li id="passa">Passa por aqui!</li>

      <li>
        <span id="frase">Dá-me cor!</span>
        <div>
          <button class="color" data-color="orange">Laranja</button>
          <button class="color" data-color="teal">Turquesa</button>
          <button class="color" data-color="purple">Roxo</button>
        </div>
      </li>

      <li>
        Experimenta escrever...
        <div><input id="escrever" type="text" /></div>
      </li>

      <li>
        Escolha uma cor:
        <select id="corPagina">
          <option value="lavender">Lavanda</option>
          <option value="peachpuff">Pêssego</option>
          <option value="lightcyan">Gelo</option>
        </select>
      </li>

      <li><button id="conta">Conta!</button> <span id="contador">0</span></li>

      <li>
        <form id="formulario">
          <input
            id="nome"
            type="text"
            placeholder="Insira o seu nome"
            required
          />
          <input
            id="idade"
            type="number"
            placeholder="Insira a sua idade"
            required
          />
          <input type="submit" value="Submit" />
        </form>
        <p id="mensagem"></p>
      </li>

      <li>Automatic Counter: <span id="automatico">0</span></li>

      <li>
        Contador guardado: <span id="guardado">0</span>
        <div>
          <button id="incrementar">+1</button>
          <button id="decrementar">-1</button>
          <button id="reset">Reset</button>
        </div>
      </li>
    </ol>

    <section>
      <h2>Select flex</h2>
      <select id="direcao">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
        <option value="column-reverse">column-reverse</option>
      </select>
      <div id="caixa">
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
        <div class="bola"></div>
      </div>
    </section>

    <script src="main.js"></script>
  </body>
</html>
